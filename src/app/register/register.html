<div class="register-container">
  <div class="register-card">
    <div class="brand-section">
      <img src="assets/healink_logo.png" alt="HEALINK Logo" class="brand-logo">
      <p class="brand-tagline">"be well soon, wish you never come back"</p>
    </div>

    <form class="register-form" (ngSubmit)="register()" #registerForm="ngForm">
      <div class="input-group">
        <mat-form-field appearance="outline">
          <mat-label>Username</mat-label>
          <mat-icon matPrefix class="input-icon">person</mat-icon>
          <input matInput type="text" placeholder="Enter your username" required [(ngModel)]="username" name="username" #usernameInput="ngModel">
          <mat-error *ngIf="usernameInput.invalid && (usernameInput.dirty || usernameInput.touched)">
            Username is required.
          </mat-error>
        </mat-form-field>
      </div>

      <div class="input-group">
        <mat-form-field appearance="outline">
          <mat-label>Email</mat-label>
          <mat-icon matPrefix class="input-icon">email</mat-icon>
          <input matInput type="text" placeholder="Enter your email" required [(ngModel)]="email" email="email" #emailInput="ngModel">
          <mat-error *ngIf="emailInput.invalid && (emailInput.dirty || emailInput.touched)">
            Email is required.
          </mat-error>
        </mat-form-field>
      </div>

      <div class="input-group">
        <mat-form-field appearance="outline">
          <mat-label>Password</mat-label>
          <mat-icon matPrefix class="input-icon">lock</mat-icon>
          <input matInput type="password" placeholder="Enter your password" required minlength="6" [(ngModel)]="password" name="password" #passwordInput="ngModel">
          <mat-error *ngIf="passwordInput.invalid && (passwordInput.dirty || passwordInput.touched)">
            <span *ngIf="passwordInput.errors?.['required']">Password is required.</span>
            <span *ngIf="passwordInput.errors?.['minlength']">Password must be at least 6 characters long.</span>
          </mat-error>
        </mat-form-field>
      </div>

      <button type="submit" class="register-button" [disabled]="registerForm.invalid">Register</button>
    </form>

    <div class="login-section">
      Already have an account? <a routerLink="/login" class="login-link">Login</a>
    </div>
  </div>
</div>
