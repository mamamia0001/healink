<!-- Container utama yang membungkus sidebar dan konten utama -->
<div class="page-container">
  
  <!-- Sidebar Navigasi -->
   <aside class="sidebar">
     <img src="assets/healink_logo2.png" alt="Healink Logo" />
    <nav>
      <ul>
        <li>Dashboard</li>
        <li>Appointment</li>
        <br>
        <li>Settings</li>
        <li>Help & Support</li>
      </ul>
    </nav>
    <button class="logout">Log Out</button>
  </aside>

  <!-- Konten Utama -->
  <main class="main-content">
    
    <!-- Header Konten Utama -->
    <header class="main-header">
      <div class="greeting">
        <h2>Hello, {{ userName }}</h2>
        <p>welcome to HEALINK's Appointment page!</p>
      </div>
      <div class="header-actions">
        <div class="search-bar">
          <input type="text" placeholder="search...">
          <button class="clear-search">&times;</button>
        </div>
      </div>
    </header>

    <!-- Body Konten Utama -->
    <div class="content-body">
      <!-- Tampilan ini muncul jika tidak ada appointment -->
      <div *ngIf="!hasAppointment" class="empty-state">
        <img src="assets/oops.png" alt="No Appointment Illustration" class="empty-state-img">
        <h3 class="oops-text">Oops</h3>
        <p class="empty-state-message">seems like you had no appointment yet</p>
        <p class="empty-state-submessage">Click the button bellow to make one!</p>
        <button class="create-appointment-btn" (click)="createAppointment()">
           Create Appointment
        </button>
      </div>

      <!-- Anda bisa menambahkan tampilan lain di sini jika 'hasAppointment' bernilai true -->
      <div *ngIf="hasAppointment" class="appointment-list">
        <!-- Tampilkan daftar appointment di sini -->
        <h2>Your Appointments</h2>
        <p>Daftar janji temu akan muncul di sini.</p>
      </div>
    </div>

  </main>
</div>
