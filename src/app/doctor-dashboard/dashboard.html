<app-navbar></app-navbar>

<div class="dashboard-container">
  <div class="top-bar">
    <search-bar (search)="handleSearch($event)"></search-bar>
    <add-patient-button (add)="handleAddPatient()"></add-patient-button>
  </div>

  <div class="patients-list">
    <patient-card
      *ngFor="let p of patients"
      [name]="p.name"
      [medicalId]="p.medicalId"
      [birthDate]="p.birthDate"
      (view)="viewPatient(p)"
    ></patient-card>
  </div>
</div>
